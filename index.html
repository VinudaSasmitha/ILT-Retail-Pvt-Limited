<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILT Retail (Pvt) Limited - Premium Apparel & Gear</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ==========================================
           1. CSS VARIABLES & THEMING
        ========================================== */
        :root[data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-topbar: #0f172a;
            --bg-header: rgba(255, 255, 255, 0.85);
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #e62329;
            --accent-hover: #dc2626;
            --accent-glow: rgba(230, 35, 41, 0.25);
            --gold-accent: #f59e0b;
            --border-color: rgba(15, 23, 42, 0.08);
            --pill-hover: rgba(230, 35, 41, 0.08);
            --shadow-header: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
        }

        :root[data-theme="dark"] {
            --bg-body: #070b14;
            --bg-topbar: #03060d;
            --bg-header: rgba(7, 11, 20, 0.82);
            --bg-card: #0f172a;
            --bg-input: #111927;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #e62329;
            --accent-hover: #ff3339;
            --accent-glow: rgba(230, 35, 41, 0.4);
            --gold-accent: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.08);
            --pill-hover: rgba(255, 255, 255, 0.06);
            --shadow-header: 0 15px 35px -10px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 200vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================
           2. TOP ANNOUNCEMENT BAR
        ========================================== */
        .top-bar {
            background-color: var(--bg-topbar);
            color: #fff;
            font-size: 0.75rem;
            padding: 0.45rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1001;
            position: relative;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .badge-flash {
            background: linear-gradient(135deg, var(--accent), #b91c1c);
            color: #fff;
            font-weight: 800;
            padding: 0.15rem 0.6rem;
            border-radius: 99px;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .top-bar-text {
            color: #94a3b8;
            font-weight: 500;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-weight: 600;
        }

        .top-link {
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: opacity 0.2s ease;
        }

        .top-link:hover { opacity: 0.8; }

        .currency-badge {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.72rem;
        }

        /* ==========================================
           3. MAIN GLASS HEADER
        ========================================== */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--bg-header);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-header);
            transition: all 0.3s ease;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        /* LOGO STYLING */
        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
        }

        .logo-box {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #991b1b);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .brand:hover .logo-box {
            transform: scale(1.05) rotate(-3deg);
        }

        .logo-box i {
            color: #fff;
            font-size: 1.3rem;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .brand-title span { color: var(--accent); }

        .brand-sub {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            color: var(--gold-accent);
            text-transform: uppercase;
        }

        /* NAVIGATION MENU */
        .main-nav ul {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            list-style: none;
            background: var(--bg-input);
            padding: 0.3rem;
            border-radius: 99px;
            border: 1px solid var(--border-color);
        }

        .main-nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1.1rem;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .main-nav a:hover {
            color: var(--text-primary);
            background-color: var(--pill-hover);
        }

        .main-nav a.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .main-nav a.highlight {
            color: var(--gold-accent);
        }

        /* SEARCH BAR */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            padding: 0.45rem 0.9rem;
            width: 180px;
            transition: width 0.3s ease, border-color 0.3s ease;
        }

        .search-box:focus-within {
            width: 230px;
            border-color: var(--accent);
        }

        .search-box i {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            width: 100%;
        }

        /* RIGHT ACTIONS */
        .right-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .icon-btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: var(--accent);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-body);
        }

        /* CTA BUTTON WITH SHIMMER */
        .cta-btn {
            position: relative;
            background: linear-gradient(135deg, var(--accent), #b91c1c);
            color: #fff;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 0.65rem 1.4rem;
            border-radius: 99px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px var(--accent-glow);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .cta-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .cta-btn:hover::after {
            transform: rotate(30deg) translateY(100%);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* MOBILE MENU TOGGLE */
        .mobile-toggle {
            display: none;
            font-size: 1.2rem;
        }

        /* ==========================================
           4. MOBILE DRAWER MENU
        ========================================== */
        .mobile-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background-color: var(--bg-card);
            z-index: 2000;
            padding: 2rem 1.5rem;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .mobile-drawer.open { right: 0; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .mobile-nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .mobile-nav-links a {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1rem;
            display: block;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .mobile-nav-links a:hover {
            background-color: var(--pill-hover);
            color: var(--accent);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ==========================================
           5. RESPONSIVE BREAKPOINTS
        ========================================== */
        @media (max-width: 1100px) {
            .search-box { display: none; }
        }

        @media (max-width: 900px) {
            .top-bar-text { display: none; }
            .center-nav { display: none; }
            .mobile-toggle { display: flex; }
        }
    </style>
</head>
<body>

    <!-- Overlay for Mobile Drawer -->
    <div id="overlay" class="overlay"></div>

    <!-- 2. Main Glassmorphism Header -->
    <header class="header">
        <div class="header-container">
            
            <!-- Left: Brand Logo -->
            <a href="/" class="brand">
                <div class="logo-box">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="brand-text">
                    <div class="brand-title">ILT<span>.</span>RETAIL</div>
                    <div class="brand-sub">Crafts & Clothing</div>
                </div>
            </a>

            <!-- Center: Navigation Links -->
            <div class="center-nav">
                <nav class="main-nav">
                    <ul>
                        <li><a href="#home" class="active">Home</a></li>
                        <li><a href="#products">Products</a></li>
                        <li><a href="#custom-kits" class="highlight"><i class="fa-solid fa-wand-magic-sparkles"></i> Custom Kits</a></li>
                        <li><a href="#crafts">Crafts</a></li>
                        <li><a href="#about">About</a></li>
                    </ul>
                </nav>
            </div>

            <!-- Right: Search, Cart, Theme Toggle, CTA -->
            <div class="right-actions">
                <!-- Search Input -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search gear, jerseys...">
                </div>

                <!-- Shopping Cart -->
                <button class="icon-btn" aria-label="Cart">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-badge">2</span>
                </button>

                <!-- Theme Toggle Button -->
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <i id="theme-icon" class="fa-solid fa-sun"></i>
                </button>

                <!-- CTA Button -->
                <a href="https://wa.me/94777588738" class="cta-btn">
                    <i class="fa-brands fa-whatsapp"></i> Get Quote
                </a>

                <!-- Mobile Hamburger Button -->
                <button id="mobile-menu-btn" class="icon-btn mobile-toggle" aria-label="Open Menu">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- 3. Mobile Slide-in Drawer -->
    <div id="mobile-drawer" class="mobile-drawer">
        <div class="drawer-header">
            <div class="brand-title">ILT<span>.</span>RETAIL</div>
            <button id="close-drawer" class="close-btn">&times;</button>
        </div>
        <ul class="mobile-nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#custom-kits">Custom Kits</a></li>
            <li><a href="#crafts">Crafts & Apparel</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>
    </div>

    <!-- 4. Theme & Interactive Scripts -->
    <script>
        // Theme Switcher Logic
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        toggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });

        function setTheme(theme) {
            htmlElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            if (theme === 'dark') {
                themeIcon.className = 'fa-solid fa-sun text-amber-400';
            } else {
                themeIcon.className = 'fa-solid fa-moon text-slate-700';
            }
        }

        // Mobile Drawer Logic
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeDrawerBtn = document.getElementById('close-drawer');
        const mobileDrawer = document.getElementById('mobile-drawer');
        const overlay = document.getElementById('overlay');

        function toggleDrawer(open) {
            if (open) {
                mobileDrawer.classList.add('open');
                overlay.classList.add('active');
            } else {
                mobileDrawer.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        mobileMenuBtn.addEventListener('click', () => toggleDrawer(true));
        closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
        overlay.addEventListener('click', () => toggleDrawer(false));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ILT Retail</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #05101d;
            --card-bg: #0e1927;
            --border: #1e293b;
            --crimson: #dc2626;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 { margin: 0; font-size: 24px; color: var(--crimson); }
        .header span { color: white; }

        .steps-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
        }

        .step-badge {
            display: inline-block;
            background: var(--crimson);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .step-card h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #05101d;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--crimson);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--crimson);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: #b91c1c; }

        .catalog-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .prod-item {
            background: #05101d;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
        }

        .prod-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .prod-title { font-size: 13px; font-weight: 700; margin: 8px 0 4px 0; }
        .prod-badge { font-size: 10px; color: var(--crimson); font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ILT<span>.ADMIN DASHBOARD</span></h1>
        <small style="color: var(--text-dim)">Control Panel for Sports & General Retail</small>
    </div>

    <div class="steps-wrapper">

        <!-- STEP 1: ADD SPORT -->
        <div class="step-card">
            <span class="step-badge">Step 1</span>
            <h3><i class="fa-solid fa-trophy"></i> Add Sport</h3>
            <form id="addSportForm">
                <div class="form-group">
                    <label>Sport Name (Cricket, Rugby etc.)</label>
                    <input type="text" id="sportName" placeholder="Cricket" required>
                </div>
                <div class="form-group">
                    <label>Tagline (Optional)</label>
                    <input type="text" id="sportTagline" placeholder="Custom Whites & Colors">
                </div>
                <div class="form-group">
                    <label>Sport Image (Choose File)</label>
                    <input type="file" id="sportImageFile" accept="image/*">
                </div>
                <button type="submit" class="btn">+ Save Sport</button>
            </form>
        </div>

        <!-- STEP 2: ADD CATEGORY -->
        <div class="step-card">
            <span class="step-badge">Step 2</span>
            <h3><i class="fa-solid fa-tags"></i> Add Category / Item Type</h3>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label>Category Name (Jersey, Cufflinks, Shorts, Medal)</label>
                    <input type="text" id="categoryName" placeholder="Cufflinks" required>
                </div>
                <button type="submit" class="btn" style="margin-top: 85px;">+ Save Category</button>
            </form>
        </div>

        <!-- STEP 3: ADD PRODUCT -->
        <div class="step-card" style="border-color: var(--crimson);">
            <span class="step-badge" style="background: #16a34a;">Step 3</span>
            <h3><i class="fa-solid fa-box-open"></i> Add Final Product</h3>
            <form id="addProductForm">
                <div class="form-group">
                    <label>1. Select Sport (Optional - Accessories සඳහා හිස්ව තබන්න)</label>
                    <select id="prodSportSelect">
                        <option value="">-- General / No Sport (Accessories) --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>2. Select Category / Type *</label>
                    <select id="prodCategorySelect" required>
                        <option value="">-- Choose Category --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Product Title *</label>
                    <input type="text" id="prodName" placeholder="Product Title" required>
                </div>

                <div class="form-group">
                    <label>Product Image (Choose File)</label>
                    <input type="file" id="prodImageFile" accept="image/*" required>
                </div>

                <button type="submit" class="btn">+ Save Product Item</button>
            </form>
        </div>

    </div>

    <!-- CATALOG VIEW -->
    <div class="catalog-card">
        <h3><i class="fa-solid fa-list"></i> Live Product Inventory</h3>
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const SERVER_URL = 'http://localhost:3000';

        const sportSelect = document.getElementById('prodSportSelect');
        const categorySelect = document.getElementById('prodCategorySelect');
        const prodNameInput = document.getElementById('prodName');
        const productsGrid = document.getElementById('productsGrid');

        document.addEventListener('DOMContentLoaded', () => {
            loadSports();
            loadCategories();
            loadProducts();
        });

        async function loadSports() {
            try {
                const res = await fetch(`${API_URL}/sports`);
                const sports = await res.json();
                sportSelect.innerHTML = '<option value="">-- General / No Sport (Accessories) --</option>';
                sports.forEach(s => {
                    sportSelect.innerHTML += `<option value="${s.id}" data-name="${s.name}">${s.name}</option>`;
                });
            } catch (err) { console.error('Error loading sports', err); }
        }

        async function loadCategories() {
            try {
                const res = await fetch(`${API_URL}/categories`);
                const categories = await res.json();
                categorySelect.innerHTML = '<option value="">-- Choose Category --</option>';
                categories.forEach(c => {
                    categorySelect.innerHTML += `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`;
                });
            } catch (err) { console.error('Error loading categories', err); }
        }

        function autoFillTitle() {
            const selectedSport = sportSelect.options[sportSelect.selectedIndex];
            const sportName = (selectedSport && selectedSport.value) ? selectedSport.dataset.name : '';
            const catName = categorySelect.options[categorySelect.selectedIndex]?.dataset?.name || '';
            
            if (sportName && catName) {
                prodNameInput.value = `${sportName} ${catName}`;
            } else if (catName) {
                prodNameInput.value = catName;
            }
        }
        
        sportSelect.addEventListener('change', autoFillTitle);
        categorySelect.addEventListener('change', autoFillTitle);

        document.getElementById('addSportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('sportName').value);
            formData.append('tagline', document.getElementById('sportTagline').value);
            if (document.getElementById('sportImageFile').files[0]) {
                formData.append('image', document.getElementById('sportImageFile').files[0]);
            }

            const res = await fetch(`${API_URL}/sports`, { method: 'POST', body: formData });
            if (res.ok) {
                alert('✅ Sport Added!');
                document.getElementById('addSportForm').reset();
                loadSports();
            }
        });

        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('categoryName').value;

            const res = await fetch(`${API_URL}/categories`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });

            if (res.ok) {
                alert('✅ Category Added!');
                document.getElementById('addCategoryForm').reset();
                loadCategories();
            }
        });

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', prodNameInput.value);
            
            if (sportSelect.value) {
                formData.append('sport_id', sportSelect.value);
            }
            formData.append('category_id', categorySelect.value);

            if (document.getElementById('prodImageFile').files[0]) {
                formData.append('image', document.getElementById('prodImageFile').files[0]);
            }

            const res = await fetch(`${API_URL}/products`, { method: 'POST', body: formData });
            if (res.ok) {
                alert('🎉 Product Item Successfully Added!');
                document.getElementById('addProductForm').reset();
                loadProducts();
            }
        });

        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const products = await res.json();
                productsGrid.innerHTML = '';
                
                products.forEach(p => {
                    const imgSrc = p.image_url ? `${SERVER_URL}${p.image_url}` : 'https://via.placeholder.com/150';
                    productsGrid.innerHTML += `
                        <div class="prod-item">
                            <img src="${imgSrc}" alt="${p.product_title}">
                            <div class="prod-badge">${p.sport_name || 'General Accessory'}</div>
                            <div class="prod-title">${p.product_title}</div>
                        </div>
                    `;
                });
            } catch (err) { console.error('Error loading products', err); }
        }
    </script>
</body>
</html>

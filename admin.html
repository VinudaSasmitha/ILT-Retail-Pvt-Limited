<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ILT Retail</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #05101d;
            --card-bg: #0e1927;
            --border: #1e293b;
            --crimson: #dc2626;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 { margin: 0; font-size: 24px; color: var(--crimson); }
        .header span { color: white; }

        .steps-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
        }

        .step-badge {
            display: inline-block;
            background: var(--crimson);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .step-card h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #05101d;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input[type="file"] {
            padding: 7px;
            cursor: pointer;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--crimson);
        }

        /* Image Preview Style */
        .img-preview {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px dashed var(--border);
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--crimson);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: #b91c1c; }

        .catalog-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .prod-item {
            background: #05101d;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .prod-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
        }

        .prod-title { font-size: 13px; font-weight: 700; margin: 8px 0 4px 0; }
        .prod-badge { font-size: 10px; color: var(--crimson); font-weight: 600; }

        .delete-btn {
            background: rgba(220, 38, 38, 0.85);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .delete-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ILT<span>.ADMIN DASHBOARD</span></h1>
        <small style="color: var(--text-dim)">Control Panel for Sports & General Retail</small>
    </div>

    <div class="steps-wrapper">

        <!-- STEP 1: ADD SPORT -->
        <div class="step-card">
            <span class="step-badge">Step 1</span>
            <h3><i class="fa-solid fa-trophy"></i> Add Sport</h3>
            <form id="addSportForm">
                <div class="form-group">
                    <label>Sport Name (Cricket, Rugby etc.)</label>
                    <input type="text" id="sportName" placeholder="Cricket" required>
                </div>
                <div class="form-group">
                    <label>Tagline (Optional)</label>
                    <input type="text" id="sportTagline" placeholder="Custom Whites & Colors">
                </div>
                <div class="form-group">
                    <label>Sport Image (Choose File)</label>
                    <input type="file" id="sportImageFile" accept="image/*">
                    <img id="sportPreview" class="img-preview" alt="Sport Preview">
                </div>
                <button type="submit" class="btn">+ Save Sport</button>
            </form>
        </div>

        <!-- STEP 2: ADD CATEGORY -->
<div class="step-card">
    <span class="step-badge">Step 2</span>
    <h3><i class="fa-solid fa-tags"></i> Add Category / Item Type</h3>
    <form id="addCategoryForm">
        <div class="form-group">
            <label>Category Name (Jersey, Cufflinks, Shorts, Medal) *</label>
            <input type="text" id="categoryName" placeholder="Cufflinks" required>
        </div>
        <div class="form-group">
            <label>Category Image (Choose File)</label>
            <input type="file" id="categoryImageFile" accept="image/*">
            <img id="catPreview" class="img-preview" alt="Category Preview">
        </div>
        <button type="submit" class="btn">+ Save Category</button>
    </form>
</div>

        <!-- STEP 3: ADD PRODUCT -->
        <div class="step-card" style="border-color: var(--crimson);">
            <span class="step-badge" style="background: #16a34a;">Step 3</span>
            <h3><i class="fa-solid fa-box-open"></i> Add Final Product</h3>
            <form id="addProductForm">
                <div class="form-group">
                    <label>1. Select Sport (Optional - Accessories සඳහා හිස්ව තබන්න)</label>
                    <select id="prodSportSelect">
                        <option value="">-- General / No Sport (Accessories) --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>2. Select Category / Type *</label>
                    <select id="prodCategorySelect" required>
                        <option value="">-- Choose Category --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Product Title *</label>
                    <input type="text" id="prodName" placeholder="Product Title" required>
                </div>

                <div class="form-group">
                    <label>Product Image (Choose File) *</label>
                    <input type="file" id="prodImageFile" accept="image/*" required>
                    <img id="prodPreview" class="img-preview" alt="Product Preview">
                </div>

                <button type="submit" class="btn">+ Save Product Item</button>
            </form>
        </div>

    </div>

    <!-- CATALOG VIEW -->
    <div class="catalog-card">
        <h3><i class="fa-solid fa-list"></i> Live Product Inventory</h3>
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const SERVER_URL = 'http://localhost:3000';

        const sportSelect = document.getElementById('prodSportSelect');
        const categorySelect = document.getElementById('prodCategorySelect');
        const prodNameInput = document.getElementById('prodName');
        const productsGrid = document.getElementById('productsGrid');

        document.addEventListener('DOMContentLoaded', () => {
            loadSports();
            loadCategories();
            loadProducts();
            setupImagePreviews();
        });

        // 1. Image Preview Generator එකට Category File Input එක එකතු කිරීම
function setupImagePreviews() {
    // Product Image Preview
    document.getElementById('prodImageFile').addEventListener('change', function(e) {
        const preview = document.getElementById('prodPreview');
        const file = e.target.files[0];
        if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
    });

    // Sport Image Preview
    document.getElementById('sportImageFile').addEventListener('change', function(e) {
        const preview = document.getElementById('sportPreview');
        const file = e.target.files[0];
        if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
    });

    // Category Image Preview (නව කොටස)
    document.getElementById('categoryImageFile').addEventListener('change', function(e) {
        const preview = document.getElementById('catPreview');
        const file = e.target.files[0];
        if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
    });
}

// 2. Add Category Form Handler (FormData භාවිතයෙන් Image එක Upload කිරීමට)
document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData();
    formData.append('name', document.getElementById('categoryName').value);
    
    const fileInput = document.getElementById('categoryImageFile');
    if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
    }

    try {
        const res = await fetch(`${API_URL}/categories`, {
            method: 'POST',
            body: formData // Multipart form data ලෙස යැවීම
        });

        if (res.ok) {
            alert('✅ Category Added Successfully!');
            document.getElementById('addCategoryForm').reset();
            document.getElementById('catPreview').style.display = 'none';
            loadCategories();
        } else {
            alert('❌ Failed to add category.');
        }
    } catch (err) {
        console.error('Error saving category:', err);
    }
});

        async function loadSports() {
            try {
                const res = await fetch(`${API_URL}/sports`);
                const resData = await res.json();
                const sports = Array.isArray(resData) ? resData : (resData.data || []);
                
                sportSelect.innerHTML = '<option value="">-- General / No Sport (Accessories) --</option>';
                sports.forEach(s => {
                    sportSelect.innerHTML += `<option value="${s.id}" data-name="${s.name}">${s.name}</option>`;
                });
            } catch (err) { console.error('Error loading sports', err); }
        }

        async function loadCategories() {
            try {
                const res = await fetch(`${API_URL}/categories`);
                const categories = await res.json();
                categorySelect.innerHTML = '<option value="">-- Choose Category --</option>';
                categories.forEach(c => {
                    categorySelect.innerHTML += `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`;
                });
            } catch (err) { console.error('Error loading categories', err); }
        }

        function autoFillTitle() {
            const selectedSport = sportSelect.options[sportSelect.selectedIndex];
            const sportName = (selectedSport && selectedSport.value) ? selectedSport.dataset.name : '';
            const catName = categorySelect.options[categorySelect.selectedIndex]?.dataset?.name || '';
            
            if (sportName && catName) {
                prodNameInput.value = `${sportName} ${catName}`;
            } else if (catName) {
                prodNameInput.value = catName;
            }
        }
        
        sportSelect.addEventListener('change', autoFillTitle);
        categorySelect.addEventListener('change', autoFillTitle);

        // Add Product Form Handler
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', prodNameInput.value);
            
            if (sportSelect.value) {
                formData.append('sport_id', sportSelect.value);
            }
            formData.append('category_id', categorySelect.value);

            const fileInput = document.getElementById('prodImageFile');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const res = await fetch(`${API_URL}/products`, { 
                    method: 'POST', 
                    body: formData 
                });

                if (res.ok) {
                    alert('🎉 Product Item Successfully Added!');
                    document.getElementById('addProductForm').reset();
                    document.getElementById('prodPreview').style.display = 'none';
                    loadProducts();
                } else {
                    alert('❌ Failed to add product.');
                }
            } catch (err) {
                console.error('Error saving product:', err);
            }
        });

        // Load Live Inventory
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const resData = await res.json();
                const products = Array.isArray(resData) ? resData : (resData.data || []);
                
                productsGrid.innerHTML = '';
                
                if (products.length === 0) {
                    productsGrid.innerHTML = '<p style="color: var(--text-dim); text-align: center; grid-column: 1/-1;">No products found.</p>';
                    return;
                }

                products.forEach(p => {
                    const title = p.name || p.product_title || 'Product';
                    const imgPath = p.image_url || p.image || '';
                    const imgSrc = imgPath ? `${SERVER_URL}${imgPath}` : 'https://via.placeholder.com/150';

                    productsGrid.innerHTML += `
                        <div class="prod-item">
                            <img src="${imgSrc}" alt="${title}">
                            <div class="prod-badge">${p.sport_name || 'General Accessory'}</div>
                            <div class="prod-title">${title}</div>
                            <button class="delete-btn" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    `;
                });
            } catch (err) { console.error('Error loading products', err); }
        }

        // Delete Product Handler
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                const res = await fetch(`${API_URL}/products/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadProducts();
                } else {
                    alert('Failed to delete product.');
                }
            } catch (err) { console.error('Error deleting product', err); }
        }
    </script>
</body>
</html>

<style>
  :root {
    --bg: #0b0e18;
    --bg-alt: #070911;
    --card: #111424;
    --card-hover: #161b30;
    --border: #1c223a;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --overlay-strong: rgba(6, 8, 14, 0.85);
    --overlay-soft: rgba(6, 8, 14, 0.1);
    --img-tint: rgba(8, 10, 20, 0.35);
  }
  html:not(.dark) {
    --bg: #f6f7fb;
    --bg-alt: #ffffff;
    --card: #ffffff;
    --card-hover: #fbfbfe;
    --border: #e3e6ef;
    --text: #0f1320;
    --text-dim: #5b6272;
    --overlay-strong: rgba(20, 22, 34, 0.55);
    --overlay-soft: rgba(20, 22, 34, 0.03);
    --img-tint: rgba(30, 32, 48, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    transition: background-color .25s ease, color .25s ease;
    overflow-x: hidden;
  }
  .font-display { font-family: 'Montserrat', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #e61c24; }

  .bg-grid {
    background-size: 34px 34px;
    background-image:
      linear-gradient(to right, var(--overlay-soft) 1px, transparent 1px),
      linear-gradient(to bottom, var(--overlay-soft) 1px, transparent 1px);
  }
  .glow-red {
    box-shadow: 0 0 22px -4px rgba(230, 28, 36, .45);
  }
  .surface { background-color: var(--card); border-color: var(--border); }
  .surface-hover:hover { background-color: var(--card-hover); }
  .text-dim { color: var(--text-dim); }
  .border-line { border-color: var(--border); }

  /* Small sport tiles with a big, decisive hover lift */
  .tile {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    transition: transform .4s cubic-bezier(.2,.9,.3,1), box-shadow .4s ease, border-color .4s ease;
  }
  .tile:hover {
    transform: translateY(-16px) scale(1.06);
    border-color: #e61c24;
    box-shadow: 0 34px 60px -20px rgba(230,28,36,.65);
    z-index: 5;
  }
  .tile img {
    transition: transform .7s ease, filter .5s ease;
    filter: saturate(1.05);
  }
  .tile:hover img { transform: scale(1.22); }
  .tile-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, var(--overlay-strong) 0%, transparent 62%);
    pointer-events: none;
  }

  .product-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    transition: transform .4s cubic-bezier(.2,.9,.3,1), box-shadow .4s ease, border-color .4s ease;
  }
  .product-tile .imgwrap { position: relative; overflow: hidden; border-radius: 16px 16px 0 0; }
  .product-tile .imgwrap::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, var(--img-tint) 0%, transparent 55%);
  }
  .product-tile img { transition: transform .55s ease; }
  .product-tile:hover img { transform: scale(1.1); }
  .product-tile:hover {
    transform: translateY(-10px) scale(1.03);
    border-color: #e61c24;
    box-shadow: 0 26px 50px -20px rgba(230,28,36,.55);
    z-index: 5;
  }

  /* Light mode: brand-yellow text is unreadable on white surfaces (it was
     designed for dark backgrounds only). Swap it for a darker amber
     whenever the site is in light mode, everywhere it's used as text,
     a tinted background, or a border. */
  html:not(.dark) .text-brand-yellow {
    color: #a15c00 !important;
  }
  html:not(.dark) .bg-brand-yellow\/15 {
    background-color: rgba(161, 92, 0, 0.12) !important;
  }
  html:not(.dark) .border-brand-yellow\/30 {
    border-color: rgba(161, 92, 0, 0.35) !important;
  }
  html:not(.dark) .hover\:text-brand-yellow:hover {
    color: #a15c00 !important;
  }

  .marquee-track { animation: marquee 30s linear infinite; }

  input::placeholder { color: var(--text-dim); opacity: .8; }

  .kbd-icon-btn { transition: transform .2s ease, background-color .2s ease, color .2s ease; }
  .kbd-icon-btn:hover { transform: translateY(-2px); }

  .theme-fade { transition: background-color .3s ease, color .3s ease, border-color .3s ease; }

  /* hidden admin trigger: a quiet dot, on purpose small */
  .admin-dot {
    width: 7px; height: 7px; border-radius: 999px;
    background: var(--text-dim); opacity: .35;
    display: inline-block; transition: opacity .2s ease, background-color .2s ease, transform .2s ease;
  }
  .admin-dot:hover { opacity: 1; background: #e61c24; transform: scale(1.6); }
</style>

async function fetchJSON(url, fallback) {
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    return data;
  } catch (e) {

}

function CatalogSection({ products, sports, filterSport, setFilterSport, filterCategory, setFilterCategory, filterType, setFilterType }) {

/* ---------------- Instagram Recap ---------------- */
function InstagramSection() {
  const [posts, setPosts] = useState(null); // null = loading, [] = empty/unconfigured

  useEffect(() => {
    fetchJSON('/api/instagram', { configured: false, posts: [] }).then((data) => {
      setPosts(data.posts || []);
    });
  }, []);

  if (posts === null) return null; // still loading, render nothing to avoid layout flash
  if (posts.length === 0) {
    // Not configured yet (or no PHP host reachable) — still invite people to Instagram
    return (
      <section className="px-4 sm:px-6 pt-10">
        <div className="rounded-2xl surface border theme-fade p-8 text-center">
          <i className="fa-brands fa-instagram text-3xl text-brand-crimson mb-3"></i>

            Visit Instagram <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </a>
        </div>
      </section>

  }

  return (
    <section className="scroll-mt-24 px-4 sm:px-6 pt-10">
      <div className="flex items-end justify-between mb-5 pb-4 border-b border-line">
        <div>
          <div className="flex items-center gap-2 text-xs font-black uppercase tracking-widest text-brand-crimson mb-1.5">
            <i className="fa-brands fa-instagram"></i> Latest From Instagram
          </div>
          <h2 className="font-display text-2xl sm:text-3xl font-black uppercase tracking-tight">@iltretail.srilanka</h2>
        </div>
        <a href={IG_URL} target="_blank" rel="noopener noreferrer" className="text-xs font-bold text-brand-crimson hover:text-brand-yellow transition-colors flex items-center gap-1.5">
          Follow <i className="fa-solid fa-arrow-right"></i>
        </a>

      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
        {posts.slice(0, 5).map((p) => (
          <a key={p.id} href={p.permalink} target="_blank" rel="noopener noreferrer" className="tile group aspect-square">
            <img src={p.image} alt={p.caption ? p.caption.slice(0, 60) : 'Instagram post'} className="absolute inset-0 w-full h-full object-cover" />

}

/* ---------------- App Root ---------------- */
function App() {
  const [dark, setDark] = useTheme();
  const [sports, setSports] = useState(FALLBACK_SPORTS);
  const [categories, setCategories] = useState(FALLBACK_CATEGORIES);
  const [products, setProducts] = useState(FALLBACK_PRODUCTS);

  const [filterSport, setFilterSport] = useState('All');
  const [filterCategory, setFilterCategory] = useState('All');
  const [filterType, setFilterType] = useState('All');

  useEffect(() => {
    fetchJSON('/api/get_sports', null).then((d) => { if (d && d.length) setSports(d); });
    fetchJSON('/api/get_categories', null).then((d) => { if (d && d.length) setCategories(d); });
    fetchJSON('/api/get_products', null).then((d) => { if (d && d.length) setProducts(d); });
  }, []);

  function goCatalog() {
    document.getElementById('catalog').scrollIntoView({ behavior: 'smooth' });
  }
  function selectSport(name) {
    setFilterSport(name); setFilterCategory('All'); goCatalog();
  }
  function selectCategory(id) {
    setFilterCategory(id); setFilterSport('All'); goCatalog();
  }

  return (
    <div id="top" className="min-h-screen relative">
      <div className="fixed inset-0 pointer-events-none z-0 bg-grid opacity-60"></div>
      <AnnouncementBar />
      <Header dark={dark} setDark={setDark} />
      <main className="relative z-10 w-full pb-8">
        <SportsSection sports={sports} onSelect={selectSport} />
        <ProductsCategorySection categories={categories} onSelect={selectCategory} />
        <CustomKitSection />
        <CatalogSection
          products={products} sports={sports}
          filterSport={filterSport} setFilterSport={setFilterSport}
          filterCategory={filterCategory} setFilterCategory={setFilterCategory}
          filterType={filterType} setFilterType={setFilterType}
        />
        <AboutSection />
        <InstagramSection />
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
